# pnpm settings for this single-package repository.
#
# pnpm fails the install when a dependency has an install script that is not
# reviewed here. Record each decision when a dependency adds one.
allowBuilds:
  # electron-builder's Windows installer maker; the app is built for macOS only.
  electron-winstaller: false
  # Optional macOS file watcher; its bundled binary is used without node-gyp.
  fsevents: false
  # Installs the Git hooks in lefthook.yml (skipped when CI is set).
  lefthook: true
  # Would download Chrome on every install, though only the QA harnesses use
  # it. `pnpm run qa:setup` downloads it for them.
  puppeteer: false
# Upstream's tests import @cesium/engine, which npm hoists from cesium's own
# dependencies. Hoisting it here keeps those tests unchanged.
publicHoistPattern:
  - '@cesium/engine'
overrides:
  # cesium 1.138.0 accepts any @cesium/widgets 14.x, and 14.4 onward needs a
  # newer @cesium/engine than the one cesium itself uses, which would put two
  # engines in the dev bundle. 14.3.0 shipped with 1.138.0 (see Cesium's pin
  # in package.json).
  '@cesium/widgets': 14.3.0
