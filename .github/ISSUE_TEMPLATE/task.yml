name: Task
description: A planned change, such as a fix, an improvement or a refactor, and what finishes it.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing. Link files and lines where that helps.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Fix
      description: The change to make.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The checks that say this is finished.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: How to check it, such as the tests or commands to run.
