name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The Release workflow runs these same checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.22.1, 26.x]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The layer-token check compares against origin/main, and the
          # baseline check against the commit before the change.
          fetch-depth: 0

      # Installs the pnpm version pinned by packageManager in package.json.
      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup policy checks
        run: pnpm run doctor --json

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check package boundaries
        run: pnpm run check:boundaries

      - name: Check published layer-token allocations
        if: github.event_name == 'pull_request'
        run: pnpm run layer-token:check --base-ref origin/main

      - name: Type-check
        run: pnpm run typecheck

      # Only an upstream merge may grow a baseline; any other change must
      # shrink them or leave them be. The base is the commit before the push,
      # the pull request's base, or HEAD^ for a manual run; a new branch has
      # none. The check reads only Git, so one Node version runs it.
      - name: Check that the baselines only shrink
        if: matrix.node == '24.22.1'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || 'HEAD^' }}
        run: pnpm run check:baselines --base "$BASE"

      - name: Find unused code
        run: pnpm run knip

      # The allocation microbenchmarks run in their own job, in parallel.
      - name: Run unit tests
        if: matrix.node != '24.22.1'
        run: node scripts/run-unit-tests.mjs --skip-allocations

      # On Node 24 the same run also measures coverage.
      - name: Run unit tests with coverage
        if: matrix.node == '24.22.1'
        run: node scripts/run-unit-tests.mjs --skip-allocations --coverage

      - name: Summarize coverage
        if: matrix.node == '24.22.1'
        run: node scripts/coverage-summary.mjs coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.node == '24.22.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

      - name: Build production bundle
        run: pnpm run build

  allocation-budgets:
    name: Allocation budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The budgets are calibrated on Node 24; any other runtime fails here.
      GEV_REQUIRE_ALLOCATION_GATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run allocation microbenchmarks
        run: pnpm run test:allocations

  street-level-browser:
    # Hermetic: every Mapillary request is answered from fixtures, so the
    # dummy token below never leaves the page.
    name: Street Level browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      # Fail on a missed header press unless the panel itself moved.
      QA_FAIL_ON_RETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # pnpm skips Puppeteer's Chrome download (pnpm-workspace.yaml).
      - name: Download headless Chrome for the harnesses
        run: pnpm run qa:setup

      - name: Build production bundle with a dummy Mapillary token
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: pnpm run build

      - name: Start the preview server
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: |
          pnpm exec vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Street Level gate with Mapillary fixtures
        run: pnpm run qa:street-level:fixtures --strict --url http://localhost:4173

      - name: Portable panel gate
        if: success() || failure()
        run: pnpm run qa:panel-resize --url http://localhost:4173

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-gate-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check package boundaries
        run: pnpm run check:boundaries

      # keySetupHardening includes the check that applies a real DACL with
      # Windows' own tools; every other job skips it. The deadline matches
      # scripts/run-unit-tests.mjs.
      - name: Run focused onboarding tests
        run: node --test --test-timeout=60000 src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupHardening.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs

      - name: Build production bundle
        run: pnpm run build
