name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by packageManager in package.json.
      - name: Use pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup policy checks
        run: pnpm run doctor --json

      - name: Check adopted formatting
        run: pnpm run format:check

      - name: Lint adopted files
        run: pnpm run lint

      - name: Check package boundaries
        run: pnpm run check:boundaries

      # The allocation microbenchmarks run in their own job, in parallel.
      - name: Run unit tests
        if: matrix.node != '24.14.0'
        run: node scripts/run-unit-tests.mjs --skip-allocations

      # On Node 24 the same run also measures coverage.
      - name: Run unit tests with coverage
        if: matrix.node == '24.14.0'
        run: node scripts/run-unit-tests.mjs --skip-allocations --coverage

      - name: Summarize coverage
        if: matrix.node == '24.14.0'
        run: node scripts/coverage-summary.mjs coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.node == '24.14.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

      - name: Build production bundle
        run: pnpm run build

  allocation-budgets:
    name: Allocation budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      # The budgets are calibrated on Node 24; any other runtime fails here.
      GEV_REQUIRE_ALLOCATION_GATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run allocation microbenchmarks
        run: pnpm run test:allocations

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Check adopted formatting
        run: pnpm run format:check

      - name: Lint adopted files
        run: pnpm run lint

      - name: Check package boundaries
        run: pnpm run check:boundaries

      # keySetupHardening includes the check that applies a real DACL with
      # Windows' own tools; every other job skips it. The flags match
      # scripts/run-unit-tests.mjs: a per-test deadline, and force-exit.
      - name: Run focused onboarding tests
        run: node --test --test-timeout=60000 --test-force-exit src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs src/keySetupHardening.test.mjs

      - name: Build production bundle
        run: pnpm run build
