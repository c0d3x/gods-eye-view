name: QA

on:
  schedule:
    # Nightly at 02:41 UTC.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      harnesses:
        description: QA harnesses to run after the track regression (scripts/<name>.mjs, space-separated)
        required: false
        default: qa-application qa-firstrun qa-map-source-tray

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Track regression and QA harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The harnesses default to this address; QA_BASE_URL is the one some of
      # them read.
      QA_BASE_URL: http://localhost:4173
      # A scheduled run has no inputs, so it gets the default list.
      HARNESSES: ${{ inputs.harnesses || 'qa-application qa-firstrun qa-map-source-tray' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Installing leaves Chrome out; this downloads Puppeteer's pinned Chrome
      # for Testing.
      - name: Download Chrome for the harnesses
        run: pnpm run qa:setup

      - name: Start the dev server without keys
        run: |
          pnpm exec vite --host localhost --port 4173 --strictPort > vite.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail --output /dev/null "$QA_BASE_URL/"; then
              # Load the entry module once so the first harness doesn't pay
              # for the dependency pre-bundling.
              curl --silent --output /dev/null "$QA_BASE_URL/src/main.js" || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::The dev server did not answer at $QA_BASE_URL"
          cat vite.log
          exit 1

      - name: Track regression
        run: pnpm run test:track

      - name: QA harnesses
        if: ${{ !cancelled() }}
        run: |
          status=0
          for harness in $HARNESSES; do
            echo "::group::$harness"
            if ! node "scripts/$harness.mjs"; then
              echo "::error::$harness failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Keep the screenshots and the server log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-screenshots
          path: |
            qa-shots/
            vite.log
          if-no-files-found: warn
          retention-days: 14
